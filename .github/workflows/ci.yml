name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pull requests run only the packages affected by their changes (turbo compares against the
# base branch, and a change to root config affects every package); pushes to main run all.
env:
  TURBO_AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-check-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-check-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run typecheck lint test check build ${{ env.TURBO_AFFECTED }} --concurrency=3
      - name: Coverage floors for fees, policy, and access rules
        run: pnpm test:coverage

  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: cohory
          POSTGRES_PASSWORD: cohory
          POSTGRES_DB: cohory
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cohory -d cohory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cohory:cohory@localhost:5433/cohory
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-integration-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-integration-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm turbo run test:integration ${{ env.TURBO_AFFECTED }} --concurrency=3

  migration-drift:
    name: Migration drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Fail on uncommitted migration changes
        run: |
          changes="$(git status --porcelain -- packages/db/migrations)"
          if [ -n "$changes" ]; then
            echo "::error title=Migration drift::The Drizzle schema in packages/db/src/schema does not match the committed migrations. Run 'pnpm db:generate', read the generated SQL, and commit it. Never edit a migration that is already on main; write a new one (AGENTS.md section 6)."
            echo "$changes"
            git --no-pager diff -- packages/db/migrations
            exit 1
          fi
